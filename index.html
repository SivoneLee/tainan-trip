<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台南同遊</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="hero">
    <div class="wrap">
      <div class="pill" id="datePill">2/18–2/21・台南同遊</div>
      <h1 id="tripTitle">載入中…</h1>
      <p class="subtitle" id="tripSubtitle">載入中…</p>

      <div class="topGrid">
        <div class="card weather">
          <div class="cardTitle">即時天氣（台南市區）</div>
          <div class="weatherNow" id="weatherNow">載入中…</div>
          <div class="weatherHint" id="weatherHint"></div>
        </div>

        <div class="btnGrid">
          <a class="btn primary" id="btnOverviewMap" target="_blank" rel="noopener">打開總覽地圖</a>
          <button class="btn" id="btnTips">旅行備忘</button>
          <button class="btn" id="btnFood">美食清單</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="section">
      <div class="sectionHead">
        <h2>行程</h2>
        <div class="rightTools">
          <button class="btn small" id="btnToggleCompact">卡片密度：一般</button>
        </div>
      </div>

      <div class="tabs" id="dayTabs"></div>
      <div class="timeline" id="timeline"></div>

      <div class="footnote">
        小提醒：行程保留彈性。看到喜歡就停一下；不想走就直接跳下一個點。
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal hidden" id="modal">
    <div class="modalBackdrop" id="modalBackdrop"></div>
    <div class="modalCard">
      <div class="modalHead">
        <div class="modalTitle" id="modalTitle">標題</div>
        <button class="iconBtn" id="modalClose">×</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
